<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tux Paint WebAssembly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #4A90E2;
            overflow: hidden;
            height: 100vh;
        }

        .tuxpaint-container {
            display: flex;
            height: 100vh;
            background: #4A90E2;
        }

        /* Left Sidebar - Tools */
        .tools-sidebar {
            width: 120px;
            background: #2C5AA0;
            border-right: 3px solid #1E3A8A;
            display: flex;
            flex-direction: column;
            padding: 10px 5px;
        }

        .tool-button {
            width: 100%;
            height: 50px;
            margin: 2px 0;
            background: #3B82F6;
            border: 2px solid #1E40AF;
            border-radius: 8px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .tool-button:hover {
            background: #60A5FA;
            transform: translateY(-1px);
        }

        .tool-button.active {
            background: #F59E0B;
            border-color: #D97706;
        }

        .tool-button.disabled {
            background: #6B7280;
            border-color: #4B5563;
            cursor: not-allowed;
        }

        .tool-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }

        /* Main Drawing Area */
        .drawing-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #E5E7EB;
        }

        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #F3F4F6;
        }

        #canvas {
            border: 3px solid #374151;
            border-radius: 8px;
            background: white;
            cursor: crosshair;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Right Sidebar - Colors and Options */
        .options-sidebar {
            width: 200px;
            background: #2C5AA0;
            border-left: 3px solid #1E3A8A;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .color-palette {
            background: #3B82F6;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
        }

        .color-palette h3 {
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .color-button {
            width: 35px;
            height: 35px;
            border: 2px solid #1E40AF;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-button:hover {
            transform: scale(1.1);
        }

        .color-button.active {
            border-color: #F59E0B;
            border-width: 3px;
        }

        .brush-selector {
            background: #3B82F6;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
        }

        .brush-selector h3 {
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }

        .brush-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .brush-option {
            background: #60A5FA;
            border: 2px solid #1E40AF;
            border-radius: 6px;
            padding: 8px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .brush-option:hover {
            background: #93C5FD;
        }

        .brush-option.active {
            background: #F59E0B;
            border-color: #D97706;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-button {
            background: #EF4444;
            border: 2px solid #DC2626;
            border-radius: 6px;
            padding: 10px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-button:hover {
            background: #F87171;
        }

        .action-button.secondary {
            background: #10B981;
            border-color: #059669;
        }

        .action-button.secondary:hover {
            background: #34D399;
        }

        /* Status Bar */
        .status-bar {
            background: #1E40AF;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
            text-align: center;
            border-top: 2px solid #1E3A8A;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #4A90E2;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #E5E7EB;
            border-top: 5px solid #F59E0B;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <h2>🎨 Tux Paint WebAssembly</h2>
            <p>Loading your drawing adventure...</p>
        </div>
    </div>

    <!-- Main Tux Paint Interface -->
    <div id="tuxpaintInterface" class="tuxpaint-container hidden">
        <!-- Left Sidebar - Tools -->
        <div class="tools-sidebar">
            <div class="tool-button active" data-tool="brush">
                <div class="tool-icon">🖌️</div>
                <div>Paint</div>
            </div>
            <div class="tool-button" data-tool="stamp">
                <div class="tool-icon">🖼️</div>
                <div>Stamp</div>
            </div>
            <div class="tool-button" data-tool="lines">
                <div class="tool-icon">📏</div>
                <div>Lines</div>
            </div>
            <div class="tool-button" data-tool="shapes">
                <div class="tool-icon">⬜</div>
                <div>Shapes</div>
            </div>
            <div class="tool-button" data-tool="text">
                <div class="tool-icon">T</div>
                <div>Text</div>
            </div>
            <div class="tool-button" data-tool="fill">
                <div class="tool-icon">🪣</div>
                <div>Fill</div>
            </div>
            <div class="tool-button" data-tool="magic">
                <div class="tool-icon">✨</div>
                <div>Magic</div>
            </div>
            <div class="tool-button" data-tool="eraser">
                <div class="tool-icon">🧽</div>
                <div>Eraser</div>
            </div>
            <div class="tool-button" data-tool="undo">
                <div class="tool-icon">↶</div>
                <div>Undo</div>
            </div>
            <div class="tool-button" data-tool="redo">
                <div class="tool-icon">↷</div>
                <div>Redo</div>
            </div>
        </div>

        <!-- Main Drawing Area -->
        <div class="drawing-area">
            <div class="canvas-container">
                <canvas id="canvas" width="640" height="480"></canvas>
            </div>
            <div class="status-bar" id="statusBar">
                Pick a color and a brush shape to draw with.
            </div>
        </div>

        <!-- Right Sidebar - Colors and Options -->
        <div class="options-sidebar">
            <!-- Color Palette -->
            <div class="color-palette">
                <h3>Colors</h3>
                <div class="color-grid">
                    <div class="color-button active" style="background: #000000;" data-color="#000000"></div>
                    <div class="color-button" style="background: #FF0000;" data-color="#FF0000"></div>
                    <div class="color-button" style="background: #00FF00;" data-color="#00FF00"></div>
                    <div class="color-button" style="background: #0000FF;" data-color="#0000FF"></div>
                    <div class="color-button" style="background: #FFFF00;" data-color="#FFFF00"></div>
                    <div class="color-button" style="background: #FF00FF;" data-color="#FF00FF"></div>
                    <div class="color-button" style="background: #00FFFF;" data-color="#00FFFF"></div>
                    <div class="color-button" style="background: #FFA500;" data-color="#FFA500"></div>
                    <div class="color-button" style="background: #800080;" data-color="#800080"></div>
                    <div class="color-button" style="background: #008000;" data-color="#008000"></div>
                    <div class="color-button" style="background: #FFC0CB;" data-color="#FFC0CB"></div>
                    <div class="color-button" style="background: #A52A2A;" data-color="#A52A2A"></div>
                    <div class="color-button" style="background: #808080;" data-color="#808080"></div>
                    <div class="color-button" style="background: #C0C0C0;" data-color="#C0C0C0"></div>
                    <div class="color-button" style="background: #FFFFFF;" data-color="#FFFFFF"></div>
                    <div class="color-button" style="background: #000000;" data-color="#000000"></div>
                </div>
            </div>

            <!-- Brush Selector -->
            <div class="brush-selector">
                <h3>Brushes</h3>
                <div class="brush-options">
                    <div class="brush-option active" data-size="3">Small</div>
                    <div class="brush-option" data-size="6">Medium</div>
                    <div class="brush-option" data-size="12">Large</div>
                    <div class="brush-option" data-size="20">Extra Large</div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="action-button secondary" id="newButton">🆕 New</button>
                <button class="action-button secondary" id="openButton">📁 Open</button>
                <button class="action-button secondary" id="saveButton">💾 Save</button>
                <button class="action-button" id="quitButton">❌ Quit</button>
            </div>
        </div>
    </div>

    <script>
        let Module;
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentColor = '#000000';
        let currentTool = 'brush';
        let brushSize = 3;

        // Initialize canvas
        function initCanvas() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        // Tool selection
        document.querySelectorAll('.tool-button').forEach(button => {
            button.addEventListener('click', function() {
                document.querySelectorAll('.tool-button').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                currentTool = this.dataset.tool;
                updateStatus();
            });
        });

        // Color selection
        document.querySelectorAll('.color-button').forEach(button => {
            button.addEventListener('click', function() {
                document.querySelectorAll('.color-button').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                currentColor = this.dataset.color;
                ctx.strokeStyle = currentColor;
                updateStatus();
            });
        });

        // Brush size selection
        document.querySelectorAll('.brush-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.brush-option').forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');
                brushSize = parseInt(this.dataset.size);
                ctx.lineWidth = brushSize;
                updateStatus();
            });
        });

        // Action buttons
        document.getElementById('newButton').addEventListener('click', function() {
            if (confirm('Start a new drawing?')) {
                initCanvas();
                updateStatus('New drawing started!');
            }
        });

        document.getElementById('saveButton').addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'tuxpaint-drawing.png';
            link.href = canvas.toDataURL();
            link.click();
            updateStatus('Drawing saved!');
        });

        document.getElementById('quitButton').addEventListener('click', function() {
            if (confirm('Quit Tux Paint?')) {
                window.close();
            }
        });

        // Drawing functionality
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            [lastX, lastY] = [e.clientX - rect.left, e.clientY - rect.top];
        }

        function draw(e) {
            if (!isDrawing) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            switch (currentTool) {
                case 'brush':
                case 'eraser':
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    break;
                case 'fill':
                    // Simple flood fill (not perfect but works for demo)
                    ctx.fillStyle = currentTool === 'eraser' ? 'white' : currentColor;
                    ctx.fillRect(x - brushSize/2, y - brushSize/2, brushSize, brushSize);
                    break;
            }
            
            [lastX, lastY] = [x, y];
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function updateStatus(message) {
            const statusBar = document.getElementById('statusBar');
            if (message) {
                statusBar.textContent = message;
            } else {
                const toolNames = {
                    'brush': 'Paint',
                    'stamp': 'Stamp',
                    'lines': 'Lines',
                    'shapes': 'Shapes',
                    'text': 'Text',
                    'fill': 'Fill',
                    'magic': 'Magic',
                    'eraser': 'Eraser',
                    'undo': 'Undo',
                    'redo': 'Redo'
                };
                statusBar.textContent = `${toolNames[currentTool]} tool selected. Pick a color and start drawing!`;
            }
        }

        // Load Tux Paint WebAssembly
        function loadTuxPaint() {
            const script = document.createElement('script');
            script.src = 'tuxpaint.js?v=' + Date.now();
            script.async = true;
            
            script.onload = function() {
                Module = window.Module;
                if (Module) {
                    console.log('Tux Paint WebAssembly loaded successfully!');
                }
                showInterface();
            };
            
            script.onerror = function() {
                console.log('Using HTML5 Canvas fallback');
                showInterface();
            };
            
            document.head.appendChild(script);
        }

        function showInterface() {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('tuxpaintInterface').classList.remove('hidden');
            initCanvas();
            updateStatus();
        }

        // Initialize
        loadTuxPaint();
    </script>
</body>
</html>
